name = "lucri-cockpit-server"
main = "src/index.js"
compatibility_date = "2025-07-18"

[[d1_databases]]
binding = "DB"
database_name = "lucri-cockpit-db"
database_id = "1b4990a1-5bf2-4a1b-8503-c0da7411e673"

# Guarda os PDFs de relatórios antigos dos clientes (ver
# src/routes/clientes.js) — os metadados (período de referência) ficam no
# D1, só o arquivo em si vai pro KV. Usamos KV em vez de R2 de propósito:
# R2 exige ativar uma assinatura (cartão cadastrado) mesmo no nível
# gratuito; KV funciona no plano gratuito sem isso. Limite de 25 MB por
# valor no KV, por isso o upload tem teto de 20 MB.
[[kv_namespaces]]
binding = "RELATORIOS_KV"
id = "f7c0517da71c4759b1551e30a71322d2"

# Recalcula histórico mensal pendente (ver src/cron/historico.js) — de hora
# em hora, mas cada mês só é refeito ~1x/dia (controlado dentro do cron, não
# aqui); a cadência horária existe só pra processar em fatias pequenas e
# nunca estourar o limite de subrequisições do Worker.
[triggers]
crons = ["0 * * * *"]

[vars]
APP_URL = "https://lucri-cockpit.pages.dev"
EMAIL_REMETENTE = "Lucri Cockpit <nao-responda@lucrifinancas.com.br>"
CONTA_AZUL_CLIENT_ID = "505p89h6j5qc34l6gdgadjtjau"
CONTA_AZUL_REDIRECT_URI = "https://lucri-cockpit-server.lucrifinancas-54e.workers.dev/api/contaazul/callback"
GOOGLE_CLIENT_ID = "639084962363-j00c9jsrvggglk02i358hhmqsqr48qgd.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI = "https://lucri-cockpit-server.lucrifinancas-54e.workers.dev/api/auth/google/callback"
